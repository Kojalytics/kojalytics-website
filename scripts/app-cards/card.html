<!doctype html>
<!--
  App card pictures for "02 / Die Apps" (render with: node scripts/app-cards/render.mjs).
  One design rule for all 13: the same light window on graph paper in the app colour, the same layout
  (title bar, menu row, list on the left, canvas, inspector on the right), the same type, and the app
  colour as the only accent. Only the canvas motif changes per app. These are illustrations, not
  screenshots; the alt texts say so.
-->
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=block">
<style>
  :root { --fg:#0e0e10; --muted:#5a5a60; --faint:#8b8b91; --line:#e3e3e1; --line2:#c9c9c6; --panel:#f7f7f5; --canvas:#eeeeeb; --bar:#dcdcd8; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:960px; height:600px; overflow:hidden; font-family:'Geist',sans-serif; color:var(--fg); -webkit-font-smoothing:antialiased; }
  .stage { position:relative; width:960px; height:600px; overflow:hidden;
    background-color:var(--t0);
    background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
    background-size:24px 24px; background-position:-1px -1px; }
  .win { position:absolute; left:48px; top:48px; width:912px; height:600px; background:#fff; border:1px solid var(--line2);
    box-shadow:0 28px 60px -28px rgba(14,14,16,.38); display:flex; flex-direction:column; }
  .bar { height:32px; flex:none; display:flex; align-items:center; gap:7px; padding:0 13px; border-bottom:1px solid var(--line); position:relative; }
  .bar i { width:10px; height:10px; border-radius:50%; background:#ff5f57; } .bar i:nth-child(2){background:#febc2e} .bar i:nth-child(3){background:#28c840}
  .bar .title { position:absolute; left:0; right:0; text-align:center; font-size:12px; font-weight:500; color:var(--muted); }
  .menu { height:34px; flex:none; display:flex; align-items:stretch; gap:20px; padding:0 18px; border-bottom:1px solid var(--line); font-size:12.5px; color:var(--muted); }
  .menu span { display:flex; align-items:center; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .menu span.on { color:var(--ink); border-color:var(--c); font-weight:600; }
  .body { flex:1; display:grid; grid-template-columns:156px 1fr 200px; min-height:0; }
  .side, .panel { background:var(--panel); padding:14px 12px; overflow:hidden; }
  .side { border-right:1px solid var(--line); } .panel { border-left:1px solid var(--line); padding:14px 14px; }
  .lbl { font-family:'Geist Mono',monospace; font-size:9.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); margin:0 0 10px; }
  .lbl + .lbl, * + .lbl { margin-top:16px; }
  .row { display:flex; align-items:center; gap:8px; height:28px; padding:0 7px; margin:0 -5px 2px; font-size:11.5px; color:var(--fg); white-space:nowrap; }
  .row.on { background:var(--t1); box-shadow:inset 2px 0 0 var(--c); font-weight:600; }
  .row .th { width:16px; height:16px; flex:none; background:var(--bar); }
  .row .meta { margin-left:auto; color:var(--faint); font-family:'Geist Mono',monospace; font-size:9.5px; }
  .canvas { position:relative; background:var(--canvas); overflow:hidden; }
  .sl { margin-bottom:12px; } .sl .t { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-bottom:6px; }
  .sl .t b { font-family:'Geist Mono',monospace; font-weight:500; color:var(--fg); font-size:10.5px; }
  .sl .tr { position:relative; height:4px; background:var(--bar); }
  .sl .tr::before { content:''; position:absolute; left:0; top:0; bottom:0; width:var(--p); background:var(--c); }
  .sl .tr::after { content:''; position:absolute; left:var(--p); top:50%; width:11px; height:11px; margin:-5.5px 0 0 -5.5px; background:#fff; border:2px solid var(--c); border-radius:50%; }
  .fld { display:flex; justify-content:space-between; align-items:center; height:28px; padding:0 9px; margin-bottom:7px; background:#fff; border:1px solid var(--line2); font-size:11.5px; }
  .fld span { color:var(--muted); } .fld b { font-weight:500; font-family:'Geist Mono',monospace; font-size:10.5px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .chip { height:26px; padding:0 10px; display:flex; align-items:center; font-size:11px; border:1px solid var(--line2); background:#fff; color:var(--muted); }
  .chip.on { background:var(--c); border-color:var(--c); color:#fff; font-weight:600; }
  .sw { display:flex; gap:6px; } .sw i { width:22px; height:22px; border:1px solid rgba(0,0,0,.06); }
  .abs { position:absolute; } .paper { background:#fff; border:1px solid var(--line); box-shadow:0 10px 24px -14px rgba(14,14,16,.28); }
  .disp { font-family:'Archivo',sans-serif; font-stretch:118%; font-weight:800; letter-spacing:-.01em; line-height:1.05; }
  .mono { font-family:'Geist Mono',monospace; }
  .ln { height:6px; background:var(--bar); margin-bottom:8px; }
  .hd { position:absolute; width:8px; height:8px; background:#fff; border:1.5px solid var(--c); }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
const q = new URLSearchParams(location.search);
const slug = q.get('app'), C = '#' + q.get('c'), NAME = q.get('name');

// Same as appInk() in src/lib/apps.ts: the app colour darkened to 4.5:1 on white.
function ink(hex) {
  let [r, g, b] = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
  const lum = (v) => { const [R, G, B] = v.map((c) => { const x = c / 255; return x <= 0.03928 ? x / 12.92 : ((x + 0.055) / 1.055) ** 2.4; }); return 0.2126 * R + 0.7152 * G + 0.0722 * B; };
  while (1.05 / (lum([r, g, b]) + 0.05) < 4.5) [r, g, b] = [r, g, b].map((c) => Math.round(c * 0.92));
  return '#' + [r, g, b].map((c) => c.toString(16).padStart(2, '0')).join('');
}
const mix = (p, w = '#fff') => `color-mix(in srgb, ${C} ${p}%, ${w})`;
const dark = (p) => mix(100 - p, '#000');
const s = document.documentElement.style;
s.setProperty('--c', C); s.setProperty('--ink', ink(C));
s.setProperty('--t0', mix(6)); s.setProperty('--grid', `color-mix(in srgb, ${C} 14%, transparent)`);
s.setProperty('--t1', mix(12)); s.setProperty('--t2', mix(24)); s.setProperty('--t3', mix(45)); s.setProperty('--t4', mix(70));

// Seeded random numbers, so every render is identical.
let seed = 7; const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

const row = (t, o = {}) => `<div class="row${o.on ? ' on' : ''}">${o.th !== false ? `<span class="th" style="${o.th || ''}"></span>` : ''}${t}${o.meta ? `<span class="meta">${o.meta}</span>` : ''}</div>`;
const sl = (t, v, p) => `<div class="sl"><div class="t">${t}<b>${v}</b></div><div class="tr" style="--p:${p}%"></div></div>`;
const fld = (t, v) => `<div class="fld"><span>${t}</span><b>${v}</b></div>`;
const chips = (a, on = 0) => `<div class="chips">${a.map((x, i) => `<span class="chip${i === on ? ' on' : ''}">${x}</span>`).join('')}</div>`;
const sw = () => `<div class="sw">${[100, 70, 45, 24, 12].map((p) => `<i style="background:${mix(p)}"></i>`).join('')}</div>`;
const lines = (ws, h = 6, gap = 8, col = 'var(--bar)') => ws.map((w) => `<div style="height:${h}px;width:${w}px;background:${col};margin-bottom:${gap}px"></div>`).join('');
const handles = (x, y, w, h) => [[x, y], [x + w, y], [x, y + h], [x + w, y + h]].map(([a, b]) => `<i class="hd" style="left:${a - 4}px;top:${b - 4}px"></i>`).join('');
const wave = (w, h, n, col, amp = 1) => { let p = ''; for (let i = 0; i < n; i++) { const v = (0.25 + 0.75 * Math.abs(Math.sin(i / 5) * rnd())) * amp * h / 2; p += `<rect x="${(i * w) / n}" y="${h / 2 - v}" width="${Math.max(1, w / n - 1.2)}" height="${v * 2}"/>`; } return `<svg width="${w}" height="${h}" fill="${col}">${p}</svg>`; };

const SCENES = {
  'word-koja': {
    file: 'Bewerbung_Hoffmann.docx', menu: ['Datei', 'Start', 'Einfügen', 'Layout', 'Referenzen', 'Überprüfen'], on: 1,
    side: ['Navigation', row('Anschreiben', { on: 1, th: false }) + row('Lebenslauf', { th: false }) + row('Zeugnisse', { th: false }) + row('Anlagen', { th: false })],
    panel: ['Formatvorlagen', `<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px">
        <div class="fld" style="height:44px;border:2px solid var(--c);font-size:11px;display:block;padding:7px 8px">Standard<div class="mono" style="font-size:8.5px;color:var(--faint);margin-top:3px">Aptos 11</div></div>
        <div class="fld" style="height:44px;display:block;padding:7px 8px"><span class="disp" style="font-size:15px;color:var(--fg)">Titel</span></div>
        <div class="fld" style="height:44px;display:block;padding:7px 8px;color:var(--ink);font-weight:600">Überschrift</div>
        <div class="fld" style="height:44px;display:block;padding:7px 8px;font-style:italic">Zitat</div></div>
        <div class="lbl">Schrift</div>${fld('Aptos', '11 pt')}${chips(['F', 'K', 'U', 'A'], 0)}`],
    canvas: `<div class="abs paper" style="left:58px;top:24px;width:360px;height:520px;padding:34px 34px">
        <div style="position:absolute;right:34px;top:30px;width:62px;height:78px;background:var(--t2);overflow:hidden"><i style="position:absolute;left:19px;top:14px;width:24px;height:24px;border-radius:50%;background:var(--t4)"></i><i style="position:absolute;left:8px;top:42px;width:46px;height:44px;border-radius:23px 23px 0 0;background:var(--c)"></i></div><div class="disp" style="font-size:22px;color:var(--ink)">Lena Hoffmann</div>
        <div style="margin:8px 0 22px">${lines([180], 4, 0, '#e6e6e3')}</div>
        ${lines([118, 132, 96, 110], 5, 6)}
        <div style="font-size:11.5px;font-weight:600;margin:16px 0 12px">Bewerbung als Projektkoordinatorin</div>
        ${lines([292, 286, 274])}
        <div style="display:flex;gap:0;margin-bottom:8px"><div style="height:6px;width:96px;background:var(--bar)"></div><div style="height:12px;margin-top:-3px;width:150px;background:var(--t2);position:relative"><div style="position:absolute;left:4px;right:4px;top:3px;height:6px;background:var(--t4)"></div></div></div>
        ${lines([210])}<div style="height:10px"></div>${lines([290, 280])}
        <div style="height:6px;width:230px;background:var(--c);opacity:.55;margin-bottom:8px"></div>${lines([150])}</div>
      ${[['MK', 'Markus K.', 104, 'var(--c)'], ['LH', 'Lena H.', 222, 'var(--t4)']].map(([a, n, y, col]) => `<div class="abs paper" style="left:426px;top:${y}px;width:126px;padding:11px 12px;box-shadow:inset 3px 0 0 ${col},0 10px 24px -14px rgba(14,14,16,.28)">
        <div style="display:flex;align-items:center;gap:7px;margin-bottom:9px"><span style="width:20px;height:20px;border-radius:50%;background:${col};color:#fff;font-size:8.5px;font-weight:600;display:grid;place-items:center">${a}</span><span style="font-size:11px;font-weight:600">${n}</span></div>
        ${lines([108, 92, 70], 5, 6)}<div class="mono" style="font-size:8.5px;color:var(--faint)">Heute, 09:41</div></div>`).join('')}`,
  },
  'grid-koja': {
    file: 'Haushaltsbuch_2026.xlsx', menu: ['Datei', 'Start', 'Einfügen', 'Formeln', 'Daten', 'Ansicht'], on: 3,
    side: ['Blätter', row('November', { on: 1, th: 'background:var(--c)' }) + row('Oktober') + row('Jahresübersicht') + row('Urlaubskasse')],
    panel: ['Diagramm', chips(['Ring', 'Balken', 'Linie'], 0) + '<div class="lbl">Farben</div>' + sw() + '<div style="height:14px"></div>' + sl('Lochgröße', '55 %', 55) + fld('Titel', 'Ausgaben')],
    canvas: (() => {
      const data = [['Miete', '950,00', '950,00', '0,00'], ['Lebensmittel', '450,00', '512,00', '−62,00'], ['Strom & Gas', '120,00', '118,00', '2,00'], ['Handy', '60,00', '55,00', '5,00'], ['Versicherung', '140,00', '140,00', '0,00'], ['Auto', '220,00', '247,00', '−27,00'], ['Freizeit', '150,00', '96,00', '54,00'], ['Sparen', '300,00', '300,00', '0,00']];
      const cols = [28, 132, 82, 82, 76]; const W = cols.reduce((a, b) => a + b);
      const cell = (t, w, st = '') => `<div style="width:${w}px;flex:none;height:100%;border-right:1px solid var(--line);display:flex;align-items:center;padding:0 8px;${st}">${t}</div>`;
      const r = (cells, st = '', h = 25) => `<div style="display:flex;height:${h}px;border-bottom:1px solid var(--line);font-size:11px;${st}">${cells.join('')}</div>`;
      let rows = r(['', 'A', 'B', 'C', 'D'].map((t, i) => cell(t, cols[i], 'justify-content:center;color:var(--faint);font-size:10px;background:#f4f4f2')), '', 22);
      rows += r([cell('1', cols[0], 'color:var(--faint);justify-content:center;background:#f4f4f2'), `<div style="flex:1;display:flex;align-items:center;padding:0 8px;font-weight:700;font-size:13px;color:var(--ink)">Haushaltsbuch · November</div>`], '', 30);
      rows += r([cell('2', cols[0], 'color:var(--faint);justify-content:center;background:#f4f4f2;color:var(--faint)'), ...['Kategorie', 'Budget', 'Ausgaben', 'Differenz'].map((t, i) => cell(t, cols[i + 1], `background:var(--c);color:#fff;font-weight:600;${i ? 'justify-content:flex-end' : ''}`))]);
      data.forEach((d, n) => { rows += r([cell(String(n + 3), cols[0], 'color:var(--faint);justify-content:center;background:#f4f4f2'), ...d.map((t, i) => cell(i ? t + ' €' : t, cols[i + 1], `${i ? 'justify-content:flex-end;font-family:Geist Mono;font-size:10.5px' : ''}${i === 3 && t.startsWith('−') ? ';background:var(--t1);color:var(--ink);font-weight:600' : ''}`))]); });
      rows += r([cell('11', cols[0], 'color:var(--faint);justify-content:center;background:#f4f4f2'), ...['Summe', '2.390,00 €', '2.418,00 €', '−28,00 €'].map((t, i) => cell(t, cols[i + 1], `font-weight:700;${i ? 'justify-content:flex-end;font-family:Geist Mono;font-size:10.5px' : ''}${i === 2 ? ';outline:2px solid var(--c);outline-offset:-2px;background:#fff;position:relative' : ''}`))], 'border-top:2px solid var(--c)', 27);
      return `<div class="abs" style="left:0;top:0;right:0;height:30px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 12px;font-size:11px"><span class="mono" style="border-right:1px solid var(--line);padding-right:12px">C11</span><i style="font-style:italic;color:var(--faint)">fx</i><span class="mono">=SUMME(<b style="color:var(--ink)">C3:C10</b>)</span></div>
        <div class="abs" style="left:0;top:30px;width:${W}px;background:#fff">${rows}</div>
        <div class="abs paper" style="left:336px;top:150px;width:206px;padding:14px 16px 16px">
          <div style="font-size:12px;font-weight:600;margin-bottom:12px">Wohin geht mein Geld?</div>
          <div style="position:relative;width:132px;height:132px;margin:0 auto 14px;border-radius:50%;background:conic-gradient(var(--c) 0 39%,var(--t4) 39% 60%,var(--ink) 60% 70%,var(--t3) 70% 82%,var(--t2) 82% 100%)">
            <div style="position:absolute;inset:30px;background:#fff;border-radius:50%;display:grid;place-items:center;text-align:center"><div><div style="font-size:9px;color:var(--faint)">Ausgaben</div><div style="font-size:13px;font-weight:700">2.418 €</div></div></div></div>
          ${[['Miete', 'var(--c)'], ['Lebensmittel', 'var(--t4)'], ['Sparen', 'var(--ink)']].map(([t, c]) => `<div style="display:flex;align-items:center;gap:7px;font-size:10.5px;color:var(--muted);margin-top:5px"><i style="width:9px;height:9px;background:${c}"></i>${t}</div>`).join('')}</div>`;
    })(),
  },
  'deck-koja': {
    file: 'Q3_Bericht.pptx', menu: ['Datei', 'Start', 'Einfügen', 'Übergänge', 'Bildschirmpräsentation'], on: 3,
    side: ['Folien', [1, 2, 3, 4].map((n) => `<div style="display:flex;gap:8px;align-items:flex-start;margin-bottom:12px"><span class="mono" style="font-size:9.5px;color:var(--faint);width:9px">${n}</span><div style="width:112px;height:63px;background:#fff;border:${n === 2 ? '2px solid var(--c)' : '1px solid var(--line2)'};padding:8px"><div style="height:4px;width:40px;background:${n === 2 ? 'var(--c)' : 'var(--t3)'};margin-bottom:5px"></div><div style="height:6px;width:70px;background:var(--fg);opacity:.75;margin-bottom:6px"></div><div style="display:flex;gap:3px;align-items:flex-end;height:20px">${[8, 13, 20].map((h, i) => `<i style="width:9px;height:${h}px;background:${['var(--t2)', 'var(--t3)', 'var(--c)'][i]}"></i>`).join('')}</div></div></div>`).join('')],
    panel: ['Übergang', `<div style="display:grid;gap:6px;margin-bottom:12px">${['Morph', 'Überblenden', 'Schieben', 'Zoom'].map((t, i) => `<span class="chip${i ? '' : ' on'}" style="height:30px">${t}</span>`).join('')}</div>` + sl('Dauer', '1,2 s', 40) + fld('Start', 'Klick')],
    canvas: `<div class="abs paper" style="left:28px;top:24px;width:524px;height:295px;padding:26px 28px">
        <div class="mono" style="font-size:10px;letter-spacing:.16em;color:var(--ink);font-weight:600">QUARTALSBERICHT · Q3 2026</div>
        <div class="disp" style="font-size:25px;margin-top:8px">Unser stärkstes Quartal</div>
        <div class="disp" style="font-size:78px;color:var(--c);margin-top:26px">+18 %</div>
        <div style="font-size:11.5px;color:var(--muted);margin-top:10px;width:220px;line-height:1.4">Umsatz gegenüber dem Vorquartal</div>
        <div class="abs" style="right:34px;bottom:30px;display:flex;gap:16px;align-items:flex-end">${[['412', 92, 'var(--t2)', 'Q1'], ['515', 122, 'var(--t3)', 'Q2'], ['608', 156, 'var(--c)', 'Q3']].map(([v, h, c, l]) => `<div style="text-align:center"><div style="font-size:10.5px;font-weight:600;margin-bottom:5px">${v} T€</div><div style="width:48px;height:${h}px;background:${c}"></div><div class="mono" style="font-size:9px;color:var(--faint);margin-top:5px">${l}</div></div>`).join('')}</div></div>
      <div class="abs paper" style="left:28px;top:336px;width:524px;height:150px;padding:14px 18px;box-shadow:none"><div class="lbl" style="margin-bottom:12px">Notizen</div>${lines([380, 420, 300], 6, 9)}</div>`,
  },
  'pdf-koja': {
    file: 'Steuer_2026_komplett.pdf', menu: ['Seiten ordnen', 'Zusammenfügen', 'Drehen', 'Schützen', 'Bearbeiten'], on: 0,
    side: ['Lesezeichen', row('Lohnsteuer', { meta: '1–2', th: false }) + row('Handwerker', { on: 1, meta: '3', th: false }) + row('Nebenkosten', { meta: '4–5', th: false }) + row('Spenden', { meta: '6', th: false }) + row('Arztrechnung', { meta: '7', th: false }) + row('Riester', { meta: '8', th: false })],
    panel: ['Seite 3', fld('Format', 'A4') + fld('Drehung', '0°') + fld('Größe', '1,2 MB') + '<div class="lbl">Schutz</div>' + `<div style="display:flex;align-items:center;justify-content:space-between;font-size:11.5px;margin-bottom:8px">Passwort<span style="width:30px;height:17px;border-radius:9px;background:var(--c);position:relative"><i style="position:absolute;right:2px;top:2px;width:13px;height:13px;border-radius:50%;background:#fff"></i></span></div>` + fld('Verschl.', 'AES-256')],
    canvas: (() => {
      const page = (x, y, n, o = {}) => `<div class="abs" style="left:${x}px;top:${y}px;text-align:center;${o.rot ? `transform:rotate(${o.rot}deg);` : ''}"><div class="paper" style="width:108px;height:146px;padding:12px 11px;text-align:left;${o.sel ? 'outline:2px solid var(--c);outline-offset:3px;' : ''}${o.rot ? 'box-shadow:0 22px 40px -16px rgba(14,14,16,.45);' : ''}"><div style="height:5px;width:26px;background:var(--c);margin-bottom:8px"></div>${lines([62, 44], 5, 5, '#a9a9ae')}<div style="height:6px"></div>${lines([86, 80, 84], 4, 5)}<div style="height:22px;border:1px solid var(--line2);margin:6px 0 8px"></div>${lines([82, 70, 76], 4, 5)}</div><div style="font-size:10px;color:var(--faint);margin-top:9px">Seite ${n}</div></div>`;
