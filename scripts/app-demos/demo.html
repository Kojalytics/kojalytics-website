<!doctype html>
<!--
  Demo loops for the app pages (render with: node scripts/app-demos/render.mjs [slug]).
  All screenshots of an app lie as windows on white graph paper. One continuous camera move glides from
  feature to feature (stops in src/content/demos.json): a blue focus frame slides from one area to the next,
  a pointer moves there and clicks, the rest of the paper fades back a little. No cuts, no fades to white,
  and no words in the picture, so the same video works in every language; the page lists the features as text.
  render(t) draws the frame at t seconds, so every frame is deterministic and the loop is seamless.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@500;600&display=block">
<style>
  :root { --accent:#2a66d8; --line2:#c9c9c6; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { width:1280px; height:800px; overflow:hidden; background:#fff; -webkit-font-smoothing:antialiased; }
  .stage { position:relative; width:1280px; height:800px; overflow:hidden; background:#fff; }
  .world { position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; }
  .paper { position:absolute; left:-6000px; top:-6000px; width:16000px; height:16000px;
    background-image:linear-gradient(#efefed 1px, transparent 1px), linear-gradient(90deg, #efefed 1px, transparent 1px);
    background-size:48px 48px; }
  .win { position:absolute; background:#efefed; border:1px solid var(--line2);
    box-shadow:0 40px 80px -48px rgba(14,14,16,.55), 0 2px 6px rgba(14,14,16,.06); }
  .win .bar { height:26px; display:flex; align-items:center; gap:7px; padding:0 11px; border-bottom:1px solid var(--line2); }
  .win .bar i { width:11px; height:11px; border-radius:50%; background:#ff5f57; }
  .win .bar i:nth-child(2) { background:#febc2e; } .win .bar i:nth-child(3) { background:#28c840; }
  .win .bar span { margin-left:auto; font:500 10px/1 'Geist Mono',monospace; letter-spacing:.16em; text-transform:uppercase; color:#8b8b91; }
  .win img { display:block; }
  .tick { position:absolute; width:22px; height:22px; }
  .tick::before, .tick::after { content:""; position:absolute; background:var(--line2); }
  .tick::before { left:10px; top:0; width:2px; height:22px; } .tick::after { left:0; top:10px; width:22px; height:2px; }
  svg { position:absolute; inset:0; overflow:visible; }
  .bar2 { position:absolute; left:0; right:0; bottom:0; height:3px; display:flex; gap:3px; }
  .bar2 span { flex:1; background:#ececea; position:relative; overflow:hidden; }
  .bar2 span i { position:absolute; inset:0; background:var(--accent); transform-origin:0 50%; }
</style>
</head>
<body>
<div class="stage">
  <div class="world" id="world"><div class="paper"></div></div>
  <svg id="ov" width="1280" height="800" viewBox="0 0 1280 800">
    <defs>
      <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.6" flood-color="#0e0e10" flood-opacity=".35"/></filter>
    </defs>
    <path id="wash" fill-rule="evenodd" fill="#ffffff"/>
    <rect id="ring" fill="none" stroke="#2a66d8" stroke-width="2.5"/>
    <g id="ticks" stroke="#2a66d8" stroke-width="2"></g>
    <text id="num" font-family="Geist Mono" font-weight="600" font-size="13" letter-spacing="1.5" fill="#2a66d8"></text>
    <circle id="ripple" fill="none" stroke="#2a66d8" stroke-width="2.5"/>
    <circle id="ripple2" fill="#2a66d8"/>
    <g id="cursor" filter="url(#shadow)">
      <path d="M0 0 L0 18.5 L4.6 14.3 L7.8 21.6 L10.7 20.4 L7.6 13.3 L13.5 13.3 Z" fill="#0e0e10" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
  </svg>
  <div class="bar2" id="bar2"></div>
</div>
<script>
const W = 1280, H = 800, BAR = 26, GAP = 190, SMAX = 1.4, WASH = 0.3;
const q = new URLSearchParams(location.search);
const slug = q.get("app");
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (x) => { x = clamp01(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const ramp = (t, a, b) => ease((t - a) / (b - a));
const lerp = (a, b, k) => a + (b - a) * k;
let T, DW, stops, wins = {}, keys, times;

// Monotone cubic interpolation (Fritsch-Carlson): smooth, never overshoots a key.
function monotone(xs, ys) {
  const n = xs.length, d = [], m = new Array(n).fill(0);
  for (let i = 0; i < n - 1; i++) d.push((ys[i + 1] - ys[i]) / (xs[i + 1] - xs[i]));
  for (let i = 1; i < n - 1; i++) m[i] = d[i - 1] * d[i] <= 0 ? 0 : (3 * (xs[i + 1] - xs[i - 1])) / ((2 * xs[i + 1] - xs[i] - xs[i - 1]) / d[i - 1] + (xs[i + 1] + xs[i] - 2 * xs[i - 1]) / d[i]);
  return (x) => {
    let i = 0;
    while (i < n - 2 && x > xs[i + 1]) i++;
    const h = xs[i + 1] - xs[i], u = clamp01((x - xs[i]) / h), u2 = u * u, u3 = u2 * u;
    return (2 * u3 - 3 * u2 + 1) * ys[i] + (u3 - 2 * u2 + u) * h * m[i] + (-2 * u3 + 3 * u2) * ys[i + 1] + (u3 - u2) * h * m[i + 1];
  };
}

// world rect of a stop (box inside its window)
const worldBox = (s, grow = 0) => {
  const w = wins[s.file];
  return [w.x + s.box[0] - grow, w.y + BAR + s.box[1] - grow, w.x + s.box[2] + grow, w.y + BAR + s.box[3] + grow];
};
const center = (r) => [(r[0] + r[2]) / 2, (r[1] + r[3]) / 2];
function fit(r, share, cap = SMAX) {
  const s = Math.min((share * W) / (r[2] - r[0]), (share * H) / (r[3] - r[1]), cap);
  const [cx, cy] = center(r);
  return { cx, cy, ls: Math.log(s) };
}
// camera for a stop: the area fills about half the frame, nudged towards the middle of its window
// so the frame shows app rather than empty paper, but never so far that the area leaves the picture
function fitStop(st) {
  const r = worldBox(st), w = wins[st.file];
  const cam = fit(r, 0.56), s = Math.exp(cam.ls);
  const [rx, ry] = center(r), wx = w.x + w.w / 2, wy = w.y + w.h / 2;
  const roomX = Math.max(0, W / (2 * s) - (r[2] - r[0]) / 2 - 48 / s), roomY = Math.max(0, H / (2 * s) - (r[3] - r[1]) / 2 - 48 / s);
  cam.cx = rx + Math.max(-roomX, Math.min(roomX, (wx - rx) * 0.4));
  cam.cy = ry + Math.max(-roomY, Math.min(roomY, (wy - ry) * 0.4));
  return cam;
}
function union(a, b) { return [Math.min(a[0], b[0]), Math.min(a[1], b[1]), Math.max(a[2], b[2]), Math.max(a[3], b[3])]; }

window.ready = (async () => {
  const data = await (await fetch("../../src/content/demos.json")).json();
  const tm = data.timing;
  DW = tm.dwell;
  stops = data.apps[slug];
  const world = document.getElementById("world");
  const name = slug.replace("-koja", "").toUpperCase() + "KOJA";

  // windows on the paper, staggered
  const files = [...new Set(stops.map((s) => s.file))];
  const imgs = await Promise.all(files.map(async (f) => { const im = new Image(); im.src = `../../public/apps/${slug}/${f}`; await im.decode(); return im; }));
  const size = imgs.map((im) => [im.naturalWidth, im.naturalHeight + BAR]);
  const pos = [[0, 0]];
  if (files.length > 1) pos.push([size[0][0] + GAP, 150]);
  if (files.length > 2) pos.push([260, Math.max(size[0][1], size[1][1] + 150) + GAP]);
  if (files.length > 3) pos.push([size[0][0] + GAP + 260, size[1][1] + 150 + GAP]);
  files.forEach((f, i) => {
    const [x, y] = pos[i], [w, h] = size[i];
    wins[f] = { x, y, w, h };
    const el = document.createElement("div");
    el.className = "win";
    Object.assign(el.style, { left: x + "px", top: y + "px", width: w + 2 + "px", height: h + 2 + "px" });
    el.innerHTML = `<div class="bar"><i></i><i></i><i></i><span>${name}</span></div>`;
    el.appendChild(imgs[i]);
    world.appendChild(el);
    for (const [tx, ty] of [[x - 40, y - 40], [x + w + 18, y - 40], [x - 40, y + h + 18], [x + w + 18, y + h + 18]]) {
      const t = document.createElement("div");
      t.className = "tick";
      Object.assign(t.style, { left: tx + "px", top: ty + "px" });
      world.appendChild(t);
    }
  });

  // timeline: wide shot -> stop 1 -> ... -> stop n -> wide shot
  const n = stops.length;
  times = stops.map((_, i) => tm.intro + i * (tm.dwell + tm.travel));
  T = times[n - 1] + tm.dwell + tm.outro;
  const all = Object.values(wins).reduce((r, w) => union(r, [w.x, w.y, w.x + w.w, w.y + w.h]), [Infinity, Infinity, -Infinity, -Infinity]);
  const wide = fit(all, 0.9, 1);
  const cams = stops.map(fitStop);
  const k = [[0, wide]];
  stops.forEach((s, i) => {
    if (i > 0) {
      const mid = fit(union(worldBox(stops[i - 1]), worldBox(s)), 0.8);
      mid.ls = Math.min(mid.ls, cams[i - 1].ls, cams[i].ls) - 0.08;
      k.push([times[i] - tm.travel / 2, mid]);
    }
    k.push([times[i], cams[i]]);
    k.push([times[i] + tm.dwell, { ...cams[i], ls: cams[i].ls + 0.06 }]);
  });
  k.push([T, wide]);
  const xs = k.map((e) => e[0]);
  keys = { cx: monotone(xs, k.map((e) => e[1].cx)), cy: monotone(xs, k.map((e) => e[1].cy)), ls: monotone(xs, k.map((e) => e[1].ls)) };
  const bar = document.getElementById("bar2");
  stops.forEach(() => bar.insertAdjacentHTML("beforeend", "<span><i></i></span>"));
  await document.fonts.ready;
  return T;
})();

window.render = (t) => {
  const n = stops.length;
  t = ((t % T) + T) % T;
  const cam = { cx: keys.cx(t), cy: keys.cy(t), s: Math.exp(keys.ls(t)) };
  document.getElementById("world").style.transform = `translate(${W / 2 - cam.cx * cam.s}px, ${H / 2 - cam.cy * cam.s}px) scale(${cam.s})`;
  const scr = (x, y) => [W / 2 + (x - cam.cx) * cam.s, H / 2 + (y - cam.cy) * cam.s];

  // which stop: i = last stop that has started, k = how far the move to the next one is
  let i = 0;
  while (i < n - 1 && t >= times[i + 1]) i++;
  const kmove = i < n - 1 ? ramp(t, times[i] + DW, times[i + 1]) : 0;

  // focus frame: grows in at the start, slides between stops, fades out at the end
  const a = worldBox(stops[i], 6), b = i < n - 1 ? worldBox(stops[i + 1], 6) : a;
  let r = a.map((v, j) => lerp(v, b[j], kmove));
  const intro = clamp01((t - (times[0] - 0.7)) / 0.7), outro = 1 - clamp01((t - (times[n - 1] + DW + 0.05)) / 0.6);
  const on = t < times[0] ? ease(intro) : ease(outro);
  if (t < times[0]) {
    const g = (1 - ease(intro)) * 60;
    r = [r[0] - g, r[1] - g, r[2] + g, r[3] + g];
  }
  const [x0, y0] = scr(r[0], r[1]), [x1, y1] = scr(r[2], r[3]);
  const ring = document.getElementById("ring");
  ring.setAttribute("x", x0); ring.setAttribute("y", y0); ring.setAttribute("width", x1 - x0); ring.setAttribute("height", y1 - y0);
  ring.setAttribute("opacity", on);
  const wash = document.getElementById("wash");
  wash.setAttribute("d", `M-10 -10H${W + 10}V${H + 10}H-10Z M${x0} ${y0}V${y1}H${x1}V${y0}Z`);
  wash.setAttribute("fill-opacity", WASH * on);
  const tk = 8, ticks = [[x0, y0, -1, -1], [x1, y0, 1, -1], [x0, y1, -1, 1], [x1, y1, 1, 1]].map(([x, y, sx, sy]) => {
    const cx = x + sx * 8, cy = y + sy * 8;
    return `<path opacity="${on}" d="M${cx - tk} ${cy}H${cx + tk}M${cx} ${cy - tk}V${cy + tk}"/>`;
  });
  document.getElementById("ticks").innerHTML = ticks.join("");
  const num = document.getElementById("num");
  const shown = kmove > 0.5 ? i + 1 : i;
  num.textContent = String(shown + 1).padStart(2, "0") + " / " + String(n).padStart(2, "0");
  num.setAttribute("x", x0); num.setAttribute("y", y0 - 14); num.setAttribute("opacity", on * (1 - Math.sin(Math.PI * kmove) * 0.85));

  // pointer: glides to each stop shortly after the camera, clicks, then waits
  const click = (s) => { const [cx, cy] = center(worldBox(s)); return [cx + Math.min(60, (s.box[2] - s.box[0]) * 0.18), cy + Math.min(40, (s.box[3] - s.box[1]) * 0.2)]; };
  const pa = click(stops[i]), pb = i < n - 1 ? click(stops[i + 1]) : pa;
  const km = i < n - 1 ? ramp(t, times[i] + DW + 0.12, times[i + 1] + 0.12) : 0;
  const mx = (pa[0] + pb[0]) / 2 - (pb[1] - pa[1]) * 0.22, my = (pa[1] + pb[1]) / 2 + (pb[0] - pa[0]) * 0.22;
  let px = (1 - km) ** 2 * pa[0] + 2 * (1 - km) * km * mx + km * km * pb[0];
  let py = (1 - km) ** 2 * pa[1] + 2 * (1 - km) * km * my + km * km * pb[1];
  const c0 = click(stops[0]);
  if (t < times[0] + 0.12) { const k0 = ramp(t, times[0] - 0.9, times[0] + 0.12); px = lerp(c0[0] + 260, c0[0], k0); py = lerp(c0[1] + 200, c0[1], k0); }
  const [sx, sy] = scr(px, py);
  // seconds since the click at the current stop (the pointer lands 0.12 s after the camera)
  const dc = t >= times[i] + 0.12 ? t - (times[i] + 0.12) : -1;
  const press = dc >= 0 && dc < 0.16 ? 0.86 : 1;
  const cur = document.getElementById("cursor");
  cur.setAttribute("transform", `translate(${sx} ${sy}) scale(${1.15 * press})`);
  cur.setAttribute("opacity", on);
  const rp = document.getElementById("ripple"), rp2 = document.getElementById("ripple2");
  const rk = dc >= 0 && dc < 0.6 ? dc / 0.6 : 1;
  rp.setAttribute("cx", sx); rp.setAttribute("cy", sy); rp.setAttribute("r", 4 + 30 * Math.sqrt(rk));
  rp.setAttribute("opacity", (1 - rk) * 0.7 * on);
  rp2.setAttribute("cx", sx); rp2.setAttribute("cy", sy); rp2.setAttribute("r", 9 * (1 - rk));
  rp2.setAttribute("opacity", (1 - rk) * 0.25 * on);

  // progress line: one segment per stop
  document.querySelectorAll("#bar2 i").forEach((el, j) => {
    const p = j < i ? 1 : j > i ? 0 : clamp01((t - times[i]) / (j < n - 1 ? times[1] - times[0] : T - times[i]));
    el.style.transform = `scaleX(${t < times[0] ? 0 : p})`;
  });
  return new Promise((r) => requestAnimationFrame(() => r()));
};
</script>
</body>
</html>
